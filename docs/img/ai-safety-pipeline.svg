<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d"><title id="t">How Mole’s AI treats text it didn’t write</title><desc id="d">Text from you, your contacts, printed cards, strangers and the open web passes one door, is minimised, fenced as untrusted and given locked rules before the model; after the model, code checks every answer and the AI never acts by itself. A failed check is never shown.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16141C"/></marker></defs><rect width="1200" height="660" fill="#FBFAF6"/><text x="40" y="50" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#16141C" text-anchor="start">How Mole’s AI treats text it didn’t write</text><text x="40" y="78" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#5A5866" text-anchor="start">Six layers, in the order a request meets them. Layers 5 and 6 don’t depend on the model obeying.</text><text x="40" y="128" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#5A36AD" text-anchor="start">TEXT MOLE DIDN’T WRITE</text><rect x="40" y="142" width="240" height="60" rx="12" fill="#E3F4E8" stroke="#116932" stroke-width="1.5"/><text x="56" y="167" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#16141C" text-anchor="start">You</text><text x="56" y="187" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">questions, notes, files, voice</text><path d="M280,172 C305,172 300,215 326,215" fill="none" stroke="#16141C" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="216" width="240" height="60" rx="12" fill="#E3F4E8" stroke="#116932" stroke-width="1.5"/><text x="56" y="241" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#16141C" text-anchor="start">Your contacts</text><text x="56" y="261" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">their notes, cards you scanned</text><path d="M280,246 C305,246 300,215 326,215" fill="none" stroke="#16141C" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="290" width="240" height="60" rx="12" fill="#FEF0E1" stroke="#B54708" stroke-width="1.5"/><text x="56" y="315" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#16141C" text-anchor="start">A printed card</text><text x="56" y="335" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">the photo of a business card</text><path d="M280,320 C305,320 300,215 326,215" fill="none" stroke="#16141C" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="364" width="240" height="60" rx="12" fill="#FEF0E1" stroke="#B54708" stroke-width="1.5"/><text x="56" y="389" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#16141C" text-anchor="start">Strangers</text><text x="56" y="409" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">profile chat, intro requests</text><path d="M280,394 C305,394 300,215 326,215" fill="none" stroke="#16141C" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="438" width="240" height="60" rx="12" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="56" y="463" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#16141C" text-anchor="start">The open web</text><text x="56" y="483" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">news pages, company websites</text><path d="M280,468 C305,468 300,215 326,215" fill="none" stroke="#16141C" stroke-width="1.5" marker-end="url(#ah)"/><text x="40" y="532" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Green: written by you or your own people.</text><text x="40" y="550" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Orange and red: anyone can write it, so it gets more checks.</text><text x="330" y="128" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#5A36AD" text-anchor="start">BEFORE THE MODEL</text><rect x="330" y="142" width="160" height="146" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><circle cx="358" cy="172" r="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="358" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#16141C" text-anchor="middle">1</text><text x="380" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="start">One door</text><text x="346" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Every call through</text><text x="346" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">ai_proxy: who, plan,</text><text x="346" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">allowance, switches</text><line x1="490" y1="215" x2="500" y2="215" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="502" y="142" width="160" height="146" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><circle cx="530" cy="172" r="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="530" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#16141C" text-anchor="middle">2</text><text x="552" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="start">Send less</text><text x="518" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Numbers and IDs out,</text><text x="518" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">sensitive lines out,</text><text x="518" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">names become {{c1}}</text><line x1="662" y1="215" x2="672" y2="215" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="674" y="142" width="160" height="146" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><circle cx="702" cy="172" r="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="702" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#16141C" text-anchor="middle">3</text><text x="724" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="start">Fence it</text><text x="690" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5866" text-anchor="start">In &lt;untrusted&gt; tags,</text><text x="690" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5866" text-anchor="start">&lt; and &gt; taken out,</text><text x="690" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5866" text-anchor="start">and “never obey it”</text><line x1="834" y1="215" x2="844" y2="215" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="846" y="142" width="160" height="146" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><circle cx="874" cy="172" r="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="874" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#16141C" text-anchor="middle">4</text><text x="896" y="177" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="start">Locked rules</text><text x="862" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Den edits can’t drop</text><text x="862" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">a feature’s fixed rules,</text><text x="862" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">or the built-in is used</text><line x1="1006" y1="215" x2="1024" y2="215" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="1026" y="142" width="134" height="146" rx="14" fill="#EEE8FB" stroke="#5A36AD" stroke-width="2"/><text x="1093" y="196" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#5A36AD" text-anchor="middle">The model</text><text x="1093" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A36AD" text-anchor="middle">no tools that</text><text x="1093" y="241" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A36AD" text-anchor="middle">write, send or pay</text><text x="330" y="342" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#5A36AD" text-anchor="start">AFTER THE MODEL: CODE, NOT THE MODEL</text><path d="M1093,288 L1093,352" fill="none" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="898" y="356" width="262" height="176" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><circle cx="926" cy="386" r="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="926" y="391" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#16141C" text-anchor="middle">5</text><text x="948" y="391" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="start">Check every answer</text><text x="916" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">shape and length right</text><text x="916" y="442" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">no link Mole didn’t supply</text><text x="916" y="462" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">no phone number or email</text><text x="916" y="482" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">no label it wasn’t given</text><text x="916" y="502" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">no sensitive sentence</text><line x1="898" y1="444" x2="846" y2="444" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="604" y="356" width="240" height="176" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><circle cx="632" cy="386" r="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="632" y="391" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#16141C" text-anchor="middle">6</text><text x="654" y="391" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="start">Never acts alone</text><text x="622" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">drafts, suggests, fills a form</text><text x="622" y="442" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">a person checks and decides</text><text x="622" y="462" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">shown as plain text, never</text><text x="622" y="482" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">code a page would run</text><line x1="604" y1="444" x2="552" y2="444" stroke="#16141C" stroke-width="2" marker-end="url(#ah)"/><rect x="330" y="394" width="220" height="100" rx="14" fill="#FFE812" stroke="#16141C" stroke-width="1.5"/><text x="440" y="436" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#16141C" text-anchor="middle">The person sees it</text><text x="440" y="460" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="middle">and chooses what to do</text><path d="M1029,532 L1029,566" fill="none" stroke="#B42318" stroke-width="2" marker-end="url(#ah)"/><rect x="604" y="570" width="556" height="62" rx="12" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="622" y="596" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#B42318" text-anchor="start">Fails a check → never shown</text><text x="622" y="617" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">“That answer didn’t pass Mole’s checks”, and the reason in the den’s AI trace</text><text x="40" y="618" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5A5866" text-anchor="start">relationship-ai-framework §10 · 19 Nov 2026</text></svg>
