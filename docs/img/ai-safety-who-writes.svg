<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" width="1200" height="704" role="img" aria-labelledby="t d"><title id="t">Who writes the text, and the checks it gets</title><desc id="d">Four bands: text written by you, by your contacts and their cards, by strangers, and by the open web. Each adds checks; company news on the open web was fixed and deployed on 19 Nov 2026.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16141C"/></marker></defs><rect width="1200" height="704" fill="#FBFAF6"/><text x="40" y="50" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#16141C" text-anchor="start">The more people who can write the text, the more checks it gets</text><text x="40" y="78" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5A5866" text-anchor="start">Every feature has layers 1 to 6; each band shows what it adds for its kind of text. Review of 19 Nov 2026: 12 features, 11 already defended, 1 fixed.</text><rect x="40" y="104" width="1120" height="122" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><rect x="40" y="104" width="12" height="122" rx="6" fill="#116932"/><text x="68" y="136" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#16141C" text-anchor="start">Written by you</text><rect x="68" y="150" width="96" height="26" rx="13" fill="#E3F4E8"/><text x="116.0" y="168" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#116932" text-anchor="middle">Defended</text><text x="68" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">4 features</text><text x="330" y="134" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Ask Sunny chat</text><text x="330" y="153" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Photo search</text><text x="330" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Files Sunny reads, Let Sunny draft it</text><text x="330" y="191" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Voice notes</text><text x="600" y="134" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5A36AD" text-anchor="start">WHAT IT ADDS</text><text x="600" y="156" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Answers only from Mole’s help answers or your own content</text><text x="600" y="176" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Image and file text is content: “never follow it”</text><text x="600" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Caps: 800 characters in chat, 12 facts from a file</text><rect x="40" y="238" width="1120" height="122" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><rect x="40" y="238" width="12" height="122" rx="6" fill="#116932"/><text x="68" y="270" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#16141C" text-anchor="start">Your contacts and their cards</text><rect x="68" y="284" width="96" height="26" rx="13" fill="#E3F4E8"/><text x="116.0" y="302" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#116932" text-anchor="middle">Defended</text><text x="68" y="334" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">5 features</text><text x="330" y="268" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Ask Sunny about your people</text><text x="330" y="287" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Meeting agenda</text><text x="330" y="306" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Follow-up drafts</text><text x="330" y="325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Card scan</text><text x="330" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Search by meaning</text><text x="600" y="268" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5A36AD" text-anchor="start">WHAT IT ADDS</text><text x="600" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Names become labels; an unknown label refuses the answer</text><text x="600" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Card text fills a form you check before saving</text><text x="600" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">A draft only: you send it. Search by meaning has no prompt</text><rect x="40" y="372" width="1120" height="122" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><rect x="40" y="372" width="12" height="122" rx="6" fill="#B54708"/><text x="68" y="404" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#16141C" text-anchor="start">Strangers</text><rect x="68" y="418" width="96" height="26" rx="13" fill="#E3F4E8"/><text x="116.0" y="436" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#116932" text-anchor="middle">Defended</text><text x="68" y="468" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">2 features</text><text x="330" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Profile chat</text><text x="330" y="421" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Request introductions</text><text x="600" y="402" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5A36AD" text-anchor="start">WHAT IT ADDS</text><text x="600" y="424" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">300 characters, scrubbed, limited per visitor</text><text x="600" y="444" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Answers only from your public content; no price not yours</text><text x="600" y="464" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Websites fetched safely: https, no private addresses</text><rect x="40" y="506" width="1120" height="122" rx="14" fill="#FFFFFF" stroke="#E6E2D6" stroke-width="1.5"/><rect x="40" y="506" width="12" height="122" rx="6" fill="#B42318"/><text x="68" y="538" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#16141C" text-anchor="start">The open web</text><rect x="68" y="552" width="176" height="26" rx="13" fill="#FEF0E1"/><text x="156.0" y="570" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B54708" text-anchor="middle">Fixed and live, 19 Nov</text><text x="68" y="602" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">1 feature</text><text x="330" y="536" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#16141C" text-anchor="start">Company news (Signals)</text><text x="600" y="536" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5A36AD" text-anchor="start">WHAT IT ADDS</text><text x="600" y="558" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">New 19 Nov: company name fenced; a web-page rule the den can’t remove</text><text x="600" y="578" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">New: the news guard checks every story before it is kept</text><text x="600" y="598" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">No number, email or link in it; source an https page the search returned</text><text x="40" y="658" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5A5866" text-anchor="start">Company news stays off in production (switch signals_news_enabled, planned for May 2027); the fix was deployed before it can be turned on.</text><text x="40" y="680" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5A5866" text-anchor="start">relationship-ai-framework §10.8 · 19 Nov 2026</text></svg>
